name: Matrix Test

on:
  push:
    branches:
      - "ci-matrix"

jobs:
  matrix-test:
    name: Light client bench (scheduled)
    #if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #light-client: [ aptos, ethereum, kadena ]
        include:
          - light-client: aptos
            benchmark: inclusion
          - light-client: aptos
            benchmark: epoch_change
          - light-client: ethereum
            benchmark: inclusion
          - light-client: ethereum
            benchmark: committee_change
          - light-client: kadena
            benchmark: spv
          - light-client: kadena
            benchmark: longest_chain
    steps:
      - run: |
          echo "${{ matrix.light-client }} ${{ matrix.benchmark }} benchmark"
